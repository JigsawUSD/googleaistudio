<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Di Napoli Sorveteria & Cafeteria</title>
    <script>
      (function () {
        var path = window.location.pathname;
        var parts = path.split('/').filter(Boolean);
        var repoBase = parts.length > 0 ? '/' + parts[0] + '/' : '/';
        if (path !== repoBase && path !== repoBase.slice(0, -1)) {
          window.location.replace(repoBase + window.location.search + window.location.hash);
        }
      })();
    </script>
  </head>
  <body style="font-family: sans-serif; text-align: center; padding: 50px; background-color: #fff8f7; color: #251918;">
    <p>Carregando Di Napoli...</p>
  </body>
</html>
