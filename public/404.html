<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Di Napoli Sorveteria & Cafeteria</title>
    <script>
      // Redireciona requisições não encontradas do GitHub Pages para a raiz da aplicação preservando rotas e parâmetros
      (function () {
        var path = window.location.pathname;
        var parts = path.split('/').filter(Boolean);
        // Se houver subpasta de repositório (ex: /repositorio/...), mantém o primeiro segmento
        var repoBase = parts.length > 0 ? '/' + parts[0] + '/' : '/';
        window.location.replace(repoBase + window.location.search + window.location.hash);
      })();
    </script>
  </head>
  <body style="font-family: sans-serif; text-align: center; padding: 50px; background-color: #fff8f7; color: #251918;">
    <p>Carregando Di Napoli...</p>
  </body>
</html>
